name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q

  install-smoke:
    name: Installer smoke test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install for Claude Code and Codex into a throwaway home
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.claude" "$HOME/.codex"
          python install.py --target all --lang en
          python "$HOME/.asg-security-guardian/app/asg_cli.py" doctor
          test -f "$HOME/.asg-security-guardian/dashboard.html"
          grep -q asg_hook.py "$HOME/.claude/settings.json"
          grep -q asg_hook.py "$HOME/.codex/hooks.json"
          python "$HOME/.asg-security-guardian/app/asg_cli.py" uninstall
          ! grep -q asg_hook.py "$HOME/.claude/settings.json"
