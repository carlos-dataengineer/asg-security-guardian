name: False positive or missed detection / Falso positivo ou não detectado
description: A rule fired on harmless content, or missed something it should have flagged.
labels: [rules]
body:
  - type: markdown
    attributes:
      value: |
        Share only **synthetic** or **public** snippets. Never upload real malware, credentials or private code.
        Compartilhe apenas trechos **sintéticos** ou **públicos**.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [False positive, Missed detection (false negative)]
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID (e.g. NET001, AI001)
  - type: input
    id: repo
    attributes:
      label: Public repository / file URL (optional)
  - type: textarea
    id: snippet
    attributes:
      label: Minimal snippet that reproduces it
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you think the result is wrong?
