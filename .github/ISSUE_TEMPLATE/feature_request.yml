name: Feature request / Sugestão
description: Propose an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: checkboxes
    id: principles
    attributes:
      label: ASG principles
      options:
        - label: The proposal keeps ASG local-only (no upload, no telemetry) unless the user explicitly opts in.
        - label: The proposal never executes scanned content and keeps per-action user approval.
